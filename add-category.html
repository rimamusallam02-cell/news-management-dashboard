<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة فئة</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .form-box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>إضافة فئة جديدة</h2>
        <form action="view-categories.html" method="GET">
            <input type="text" placeholder="اسم الفئة (مثال: أخبار رياضية)" required>
            <button type="submit">حفظ الفئة</button>
        </form>
        <a href="dashboard.html">العودة للرئيسية</a>
    </div>
</body>
</html>
