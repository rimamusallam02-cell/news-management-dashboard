<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة خبر</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { max-width: 500px; margin: auto; background: white; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>إضافة خبر جديد للنظام</h2>
        <form action="view-news.html" method="GET">
            <input type="text" placeholder="عنوان الخبر" required>
            <select required>
                <option value="">اختر ID الفئة التي ينتمي لها الخبر</option>
                <option value="1">1 - أخبار رياضية</option>
                <option value="2">2 - أخبار سياسية</option>
                <option value="3">3 - أخبار اقتصادية</option>
            </select>
            <textarea placeholder="تفاصيل الخبر" rows="4" required></textarea>
            <label>صورة الخبر:</label>
            <input type="file" accept="image/*" required>
            <input type="hidden" value="5"> 
            <button type="submit">حفظ الخبر في قاعدة البيانات</button>
        </form>
        <a href="dashboard.html">العودة للرئيسية</a>
    </div>
</body>
</html>
